<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tienda de carne">
    <meta name="author" content="Mariano Gonzalez, Matias Romano, Maximo Paz">
    <meta name="keywords" content="carne,wagyu,premium,argentina,cortes de carnes">
    <link rel="stylesheet" href="../css/login.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>Inicio de sesión</title>
</head>
<body>
    <div class="caja-login">
        <div class="titulo-login">
            <h1>Inicia Sesión</h1>
            <p>Ingrese su cuenta para continuar</p>
        </div>

        <form>
            <div class="campo">
                <label for="email">Correo electrónico</label>
                <div class="input-con-icono">
                    <i class="far fa-envelope icono"></i>
                    <input type="email" id="email" name="email" placeholder="nombre@gmail.com" required minlength="7" maxlength="40">
                </div>
            </div>

            <div class="campo">
                <div class="etiquetas">
                    <label for="password">Contraseña</label>
                    <a href="../pages/error404.html" class="olvido">¿Olvidaste tu contraseña?</a>
                </div>
                <div class="input-con-icono">
                    <i class="fas fa-lock icono"></i>
                    <input type="password" id="password" name="password" placeholder="Introduzca su contraseña" required minlength="3" maxlength="15">
                </div>
            </div>

            <button type="submit" class="boton-entrar">Iniciar sesión</button>
        </form>

        <div class="separador">
            <span>o</span>
        </div>

        <div class="redes">
            <a href="./error404.html">
                <button type="button" class="boton-red">
                    <img src="../assets/img/Made by Google.png" alt="Logo de Google" width="18" height="18">
                    Continuar con Google
                </button>
            </a>
            
            <a href="./error404.html">
                <button type="button" class="boton-red facebook">
                    <img src="../assets/img/facelogo.png" alt="Logo de Facebook" width="18" height="18">
                    Continuar con Facebook
                </button>
            </a>
        </div>

        <div class="pie-login">
            <p>¿No tienes cuenta? <a href="./registro.html" class="registro">Regístrate</a></p>
        </div>    
    </div>
</body>
</html>
