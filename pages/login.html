<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tienda de carne" />
    <meta name="author" content="Mariano Gonzalez, Maximo Paz, Matias Romano" />
    <meta name="keywords" content="carne,wagyu,premium,argentina" />
    <link rel="shortcut icon" href="../assets/img/logo.png" type="image/x-icon" />
    <title>Inicio de sesión</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">  
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>

<div class="w-100" style="max-width: 420px; padding: 2rem;">
    <div class="card">
        <div class="card-body p-4 p-md-5 text-center">
            <h2 class="titulo">Inicia Sesión</h2>
            <p class="subtitulo">Ingrese su cuenta para continuar</p>

            <form>
                <div class="mb-3 text-start">
                    <label class="form-label etiqueta" for="email">Correo electrónico</label>
                    <div class="input-group">
                        <span class="input-group-text border-end-0"><i class="fa-solid fa-envelope"></i></span>
                        <input type="email" id="email" name="email" class="form-control entrada border-start-0 ps-2" placeholder="nombre@gmail.com" required minlength="7" maxlength="40">
                    </div>
                </div>

                <div class="mb-4 text-start">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <label class="form-label etiqueta mb-0" for="password">Contraseña</label>
                        <a href="../pages/error404.html" class="olvido">¿Olvidaste tu contraseña?</a>
                    </div>
                    <div class="input-group">
                        <span class="input-group-text border-end-0"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" id="password" name="password" class="form-control entrada border-start-0 ps-2" placeholder="Introduzca su contraseña" required minlength="3" maxlength="15">
                    </div>
                </div>

                <button type="submit" class="w-100 boton-principal mb-3">Iniciar Sesión</button>

                <div class="d-flex align-items-center mb-3 text-muted" style="font-size: 0.8rem;">
                    <hr class="flex-grow-1">
                    <span class="px-3">O ingresa con</span>
                    <hr class="flex-grow-1">
                </div>

                <a href="./error404.html" class="w-100 py-2 mb-2 boton-social text-decoration-none d-flex align-items-center justify-content-center gap-2">
                    <i class="fa-brands fa-google text-danger"></i> Continuar con Google
                </a>
                
                <a href="./error404.html" class="w-100 py-2 mb-4 boton-social text-decoration-none d-flex align-items-center justify-content-center gap-2">
                    <i class="fa-brands fa-facebook-f text-primary"></i> Continuar con Facebook
                </a>

                <p class="mb-0" style="font-size: 0.8rem; color: black;">¿No tienes cuenta? <a href="./registro.html" class="enlace">Regístrate</a></p>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
