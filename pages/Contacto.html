<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tienda de carne">
    <meta name="author" content="Mariano Gonzalez, Matias Romano, Maximo Paz">
    <meta name="keywords" content="carne,wagyu,premium,argentina,cortes de carnes">
    <title>Contacto</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <link rel="stylesheet" href="../css/contacto.css">
</head>
<body>

    <main>
        <div class="d-flex justify-content-center p-4 contenedor-principal">
            <div class="card p-4 p-md-5 w-100 w-lg-75 mx-4 my-5">
                <h3 class="text-center mb-4 titulo-contacto">Comunicate con nosotros</h3>
                <div class="row g-4 align-items-center">
                    <div class="col-12 col-lg-6">
                        <form>
                            <div class="row mb-3 g-3">
                                <div class="col-12 col-md-6 text-start">
                                    <label for="Nombre" class="form-label etiqueta">Nombre</label>
                                    <input type="text" id="Nombre" class="form-control entrada w-100" placeholder="Ej: Juan" minlength="3" maxlength="25" required>
                                </div>
                                <div class="col-12 col-md-6 text-start">
                                    <label for="Apellido" class="form-label etiqueta">Apellido</label>
                                    <input type="text" id="Apellido" class="form-control entrada w-100" placeholder="Ej: Ruiz" minlength="3" maxlength="25" required>
                                </div>
                            </div>
                            <div class="mb-3 text-start">
                                <label for="Email" class="form-label etiqueta">Email</label>
                                <input type="email" id="Email" class="form-control entrada w-100" placeholder="Ej: novastream@gmail.com" minlength="5" maxlength="30" required>
                            </div>
                            <div class="mb-4 text-start">
                                <label for="mensaje" class="form-label etiqueta">Mensaje o Consulta</label>
                                <textarea id="mensaje" class="form-control entrada w-100" placeholder="Escribí tu consulta acá..." required minlength="5" maxlength="400" rows="4"></textarea>
                            </div>
                            <button type="submit" class="w-100 boton-principal">Enviar mensaje</button>
                        </form>
                    </div>
                    
                    <div class="col-12 col-lg-6 mt-5 mt-lg-0">
                        <div class="p-4 h-100 d-flex flex-column justify-content-center">
                            <h4 class="fw-bold mb-3 text-center subtitulo-contacto">Atención Personalizada</h4>
                            <p class="mb-4 text-center texto-descriptivo">
                                ¿Necesitás ayuda con tu cuenta, tu suscripción o tenés dudas sobre nuestro catálogo?
                                Hablá directamente con nuestro equipo para recibir asistencia rápida y sin vueltas.
                            </p>
                            <div class="row g-3 text-center text-xl-start">
                                <div class="col-12 col-xl-6">
                                    <span class="d-block mb-2 etiqueta">Correo:</span>
                                    <a href="mailto:novastream@gmail.com" class="text-decoration-none enlace-correo">
                                        novastream@gmail.com
                                    </a>
                                </div>
                                <div class="col-12 col-xl-6">
                                    <span class="d-block mb-2 etiqueta">Línea Directa:</span>
                                    <a href="" target="_blank" class="w-100 py-2 text-decoration-none d-flex align-items-center justify-content-center gap-2 boton-social mb-0">
                                        <i class="bi bi-whatsapp text-success"></i> Chatear
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
