<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Tienda de carne" />
    <meta name="author" content="Mariano Gonzalez" />
    <meta name="keywords" content="carne,wagyu,premium,argentina" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../css/registro.css" />
    <title>La Reserva Del asador</title>
  </head>
  <body>
    <!doctype html>
    <html lang="es">
      <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Registro Bootstrap 5.3.8</title>

        <link
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-..."
          crossorigin="anonymous"
        />
      </head>

      <body data-bs-theme="dark" class="bg-black">
        <div
          class="min-vh-100 d-flex align-items-center justify-content-center p-3"
        >

          <div
            class="card border-0 shadow-lg"
            style="width: 100%; max-width: 400px; background-color: #1a1a2e"
          >
            <div class="card-body p-4 p-sm-5">
              <h3 class="text-center text-light mb-4 fw-bold">Registro</h3>

              <form>
                <div class="form-floating mb-3">
                  <input
                    type="text"
                    class="form-control bg-dark border-primary text-light"
                    id="usuario"
                    placeholder="Usuario"
                    required
                  />
                  <label for="usuario" class="text-muted">Usuario</label>
                </div>

                <div class="form-floating mb-3">
                  <input
                    type="email"
                    class="form-control bg-dark border-primary text-light"
                    id="email"
                    placeholder="Email"
                    required
                  />
                  <label for="email" class="text-muted">Email</label>
                </div>

                <div class="form-floating mb-4">
                  <input
                    type="password"
                    class="form-control bg-dark border-primary text-light"
                    id="password"
                    placeholder="Contraseña"
                    required
                  />
                  <label for="password" class="text-muted">Contraseña</label>
                </div>

                <button
                  type="submit"
                  class="btn w-100 py-2 fw-bold text-light"
                  style="background-color: #5a189a; border-color: #0077b6"
                >
                  Crear cuenta
                </button>
              </form>
            </div>
          </div>
        </div>

        <script
          src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
          crossorigin="anonymous"
        ></script>
      </body>
    </html>
  </body>
</html>
