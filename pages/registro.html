<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/registro.css">
</head>
<body class="min-vh-100 d-flex align-items-center justify-content-center m-0">

<div class="w-100" style="max-width: 420px; padding: 2rem;">
    <div class="card shadow-sm border-0 rounded-3">
        <div class="card-body p-4 text-center">
            <h2 class="titulo text-uppercase mb-1">Crear Cuenta</h2>
            <p class="subtitulo text-uppercase mb-4 small">Ingrese sus datos para registrarse</p>

            <form>
                <div class="mb-3 text-start">
                    <label class="form-label etiqueta text-uppercase small">Nombre Completo</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-end-0">👤</span>
                        <input type="text" class="form-control entrada border-start-0" placeholder="Tu nombre completo" required>
                    </div>
                </div>

                <div class="mb-3 text-start">
                    <label class="form-label etiqueta text-uppercase small">Correo Electrónico</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-end-0">✉️</span>
                        <input type="email" class="form-control entrada border-start-0" placeholder="nombre@correo.com" required>
                    </div>
                </div>

                <div class="mb-3 text-start">
                    <label class="form-label etiqueta text-uppercase small">Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-end-0">🔒</span>
                        <input type="password" class="form-control entrada border-start-0" placeholder="Ingrese su contraseña" required>
                    </div>
                </div>

                <div class="mb-4 text-start">
                    <label class="form-label etiqueta text-uppercase small">Confirmar Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-end-0">🔒</span>
                        <input type="password" class="form-control entrada border-start-0" placeholder="Repita su contraseña" required>
                    </div>
                </div>

                <button type="submit" class="btn w-100 py-2 boton-principal text-uppercase">Crear Cuenta</button>

                <div class="d-flex align-items-center my-4 text-muted small">
                    <hr class="flex-grow-1">
                    <span class="px-3">o</span>
                    <hr class="flex-grow-1">
                </div>

                <a href="./error404.html"><button type="button" class="btn w-100 mb-2 boton-social">
                    <span class="me-2">G</span> Continuar con Google
                </button>
                <button type="button" class="btn w-100 mb-3 boton-social">
                    <span class="me-2">f</span> Continuar con Facebook
                </button></a>

                <p class="mb-0 small">¿Ya tienes cuenta? <a href="./login.html" class="enlace fw-semibold text-uppercase">Inicia Sesión</a></p>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
