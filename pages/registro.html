<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tienda de carne" />
    <meta name="author" content="Mariano Gonzalez, Maximo Paz, Matias Romano" />
    <meta name="keywords" content="carne,wagyu,premium,argentina" />
    <link rel="shortcut icon" href="../assets/img/logo.png" type="image/x-icon" />
    <title>Registro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/registro.css">
</head>
<body>

<div class="w-100" style="max-width: 420px; padding: 2rem;">
    <div class="card">
        <div class="card-body p-4 p-md-5 text-center">
            <h2 class="titulo">Crear Cuenta</h2>
            <p class="subtitulo">Ingrese sus datos para registrarse</p>

            <form>
                <div class="mb-3 text-start">
                    <label class="form-label etiqueta">Nombre Completo</label>
                    <div class="input-group">
                        <span class="input-group-text border-end-0"><i class="fa-solid fa-user"></i></span>
                        <input type="text" class="form-control entrada border-start-0 ps-2" placeholder="Tu nombre completo" required>
                    </div>
                </div>

                <div class="mb-3 text-start">
                    <label class="form-label etiqueta">Correo Electrónico</label>
                    <div class="input-group">
                        <span class="input-group-text border-end-0"><i class="fa-solid fa-envelope"></i></span>
                        <input type="email" class="form-control entrada border-start-0 ps-2" placeholder="nombre@correo.com" required>
                    </div>
                </div>

                <div class="mb-3 text-start">
                    <label class="form-label etiqueta">Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text border-end-0"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" class="form-control entrada border-start-0 ps-2" placeholder="Ingrese su contraseña" required>
                    </div>
                </div>

                <div class="mb-4 text-start">
                    <label class="form-label etiqueta">Confirmar Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text border-end-0"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" class="form-control entrada border-start-0 ps-2" placeholder="Repita su contraseña" required>
                    </div>
                </div>

                <button type="submit" class="w-100 boton-principal mb-3">Crear Cuenta</button>

                <div class="d-flex align-items-center mb-3 text-muted" style="font-size: 0.8rem; ">
                    <hr class="flex-grow-1">
                    <span class="px-6" >o regístrate con</span>
                    <hr class="flex-grow-1">
                </div>

                <a href="./error404.html" class="w-100 py-2 mb-2 boton-social text-decoration-none d-flex align-items-center justify-content-center gap-2">
                    <i class="fa-brands fa-google text-danger"></i> Continuar con Google
                </a>
                <a href="./error404.html" class="w-100 py-2 mb-4 boton-social text-decoration-none d-flex align-items-center justify-content-center gap-2">
                    <i class="fa-brands fa-facebook-f text-primary"></i> Continuar con Facebook
                </a>

                <p class="mb-0" style="font-size: 0.8rem; color: black;">¿Ya tienes cuenta? <a href="./login.html" class="enlace">Inicia Sesión</a></p>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
